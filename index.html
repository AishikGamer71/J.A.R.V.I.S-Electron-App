<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <title>JARVIS Desktop</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
    script-src * 'unsafe-inline' 'unsafe-eval' data: blob: https://cdn.jsdelivr.net https://js.puter.com;
    worker-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
    connect-src * data: blob: 'unsafe-inline';
    img-src * data: blob: file: 'unsafe-inline';
    media-src * data: blob: file: 'unsafe-inline';
    style-src * 'unsafe-inline';
  "
    />
    <script>
      // Pre-paint dark background before app bundle loads (prevents white flash)
      document.documentElement.style.backgroundColor = '#050505'
      document.documentElement.style.colorScheme = 'dark'
    </script>
  </head>

  <body class="bg-black text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
