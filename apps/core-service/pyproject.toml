[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-core-service"
version = "4.0.0"
description = "Autonomous hexagonal core service and neural gateway for J.A.R.V.I.S"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psutil>=6.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "litellm>=1.44.0",
    "pyyaml>=6.0.0",
    "rich>=13.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
